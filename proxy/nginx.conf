# Bloc server : un « site » servi par Nginx
server {
    # listen (écouter) : Nginx attend les requêtes sur le port 80 du conteneur
    listen 80;

    # location (emplacement) / : toutes les adresses qui commencent par /
    location / {
        # proxy_pass (transmettre au proxy) : renvoie la requête à Uptime Kuma
        proxy_pass http://uptime-kuma:3001;
        # proxy_http_version (version HTTP du proxy) : WebSocket exige HTTP/1.1 (Nginx parle 1.0 par défaut)
        proxy_http_version 1.1;
        # Upgrade (mise à niveau) : transmet la demande du navigateur de passer en WebSocket
        proxy_set_header Upgrade $http_upgrade;
        # Connection (connexion) : confirme le changement de protocole
        proxy_set_header Connection "upgrade";
        # Host (hôte) : transmet le nom demandé par le navigateur (localhost:8080)
        proxy_set_header Host $host;
    }
}